<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calico Kitten in Raincoat - Animated Pastel-Sketch Canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #232a2e;
      color: #e8eff0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #181d20;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid #323d42;
      max-width: 900px;
      width: 100%;
    }
    canvas {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      background: #d2dedf;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
      justify-content: center;
      width: 100%;
    }
    button {
      background: #2b353a;
      border: 1px solid #45555c;
      color: #d2dedf;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover {
      background: #3c4b52;
      border-color: #fce678;
      color: #fce678;
    }
    button.active {
      background: #fce678;
      color: #2b2726;
      border-color: #fce678;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <canvas id="catCanvas" width="1000" height="1000"></canvas>
    <div class="controls">
      <button id="btnPlay">Pause</button>
      <button class="active" data-preset="idle">Idle Breath</button>
      <button data-preset="stroll">Rainy Stroll</button>
      <button data-preset="splash">Puddle Jump</button>
      <button data-preset="sleepy">Sleepy Nap</button>
      <button id="btnBoil">Boil: 8 FPS</button>
      <button id="btnEye">Eyes: Sleepy</button>
      <button id="btnRain">Rain: Off</button>
    </div>
  </div>

  <script src="/catAnimationStandalone.js"></script>
</body>
</html>
